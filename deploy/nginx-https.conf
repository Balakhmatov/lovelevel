server {
    listen 80;
    listen [::]:80;
    server_name lovelevel.cityai.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/lovelevel-acme; }
    location / { return 301 https://lovelevel.cityai.site$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lovelevel.cityai.site;
    ssl_certificate /etc/letsencrypt/live/lovelevel.cityai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovelevel.cityai.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:3118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        proxy_hide_header X-Powered-By;
    }
}
