# Install only after DNS and a certificate covering ALL THREE names are ready.
# Replace the existing server blocks for these exact names, rather than enabling duplicates.
# Keep stage.cityai.site and pulse.cityai.site vhosts unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name matchlove.cityai.site lovelevel.cityai.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/lovelevel-acme; }
    location / { return 302 https://matchlove.cityai.site$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name matchlove.cityai.site;
    ssl_certificate /etc/letsencrypt/live/matchlove.cityai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matchlove.cityai.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 52m;
    location / {
        proxy_pass http://127.0.0.1:3118;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_hide_header X-Powered-By;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lovelevel.cityai.site;
    ssl_certificate /etc/letsencrypt/live/matchlove.cityai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matchlove.cityai.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 302 https://matchlove.cityai.site$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name cityai.site;
    location ^~ /.well-known/acme-challenge/ { root /var/www/lovelevel-acme; }
    # CityAI /app and other former CityAI paths all lead to the MatchLove home.
    location / { return 302 https://matchlove.cityai.site/; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cityai.site;
    ssl_certificate /etc/letsencrypt/live/matchlove.cityai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matchlove.cityai.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 302 https://matchlove.cityai.site/; }
}
